<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Reversi: a two-sided clay disc caught mid-flip, tilted on the green baize -->
  <defs>
    <linearGradient id="baize" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7a4e"/>
      <stop offset="1" stop-color="#0b3d26"/>
    </linearGradient>
    <linearGradient id="obsidian" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="0.45" stop-color="#1a1a1e"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="moonstone" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f2ead8"/>
      <stop offset="1" stop-color="#c9bfa6"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8a6d1f"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#baize)"/>
  <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="6" fill="none" stroke="url(#brass)" stroke-width="1.6"/>

  <!-- Three discs already settled on the baize (faint, supporting) -->
  <circle cx="7.5" cy="24" r="2.6" fill="#0a0a0c" opacity="0.55"/>
  <circle cx="24.5" cy="24" r="2.6" fill="#f2ead8" opacity="0.5"/>
  <circle cx="16" cy="26.6" r="2.4" fill="#0a0a0c" opacity="0.45"/>

  <!-- Main disc: squashed ellipse to read as a 55-degree tilt, obsidian left / moonstone right -->
  <g transform="translate(16 13.4)">
    <ellipse cx="0" cy="0" rx="9" ry="8.2" fill="url(#obsidian)"/>
    <path d="M0 -8.2 A9 8.2 0 0 1 0 8.2 Z" fill="url(#moonstone)"/>
    <ellipse cx="0" cy="0" rx="9" ry="8.2" fill="none" stroke="#1c1c22" stroke-width="0.7" opacity="0.5"/>
    <path d="M-6.6 -4.4 A9 8.2 0 0 1 -1.4 -7.8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M0 -7.9 A9 8.2 0 0 1 3.6 -7.1" fill="none" stroke="#c9a227" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
