<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="woodBg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#3d2c20"/>
      <stop offset="100%" stop-color="#19120c"/>
    </radialGradient>
    <linearGradient id="brassTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#aa8222"/>
      <stop offset="100%" stop-color="#785910"/>
    </linearGradient>
    <linearGradient id="woodTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4231"/>
      <stop offset="100%" stop-color="#3b291d"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- 外框木盒 -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#woodBg)" stroke="#8c6a38" stroke-width="2"/>
  <!-- 凹槽内托 -->
  <rect x="6" y="6" width="52" height="52" rx="6" fill="#120c08" stroke="#000" stroke-width="1.5"/>

  <!-- 方块 (3x3 示意的推盘) -->
  <!-- Row 1 -->
  <rect x="9" y="9" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="16" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">1</text>

  <rect x="25" y="9" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="32" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">2</text>

  <rect x="41" y="9" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="48" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">3</text>

  <!-- Row 2 -->
  <rect x="9" y="25" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="16" y="36" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">4</text>

  <rect x="25" y="25" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="32" y="36" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">5</text>

  <rect x="41" y="25" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="48" y="36" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">6</text>

  <!-- Row 3: 7, 8, 空格 -->
  <rect x="9" y="41" width="14" height="14" rx="3" fill="url(#woodTile)" stroke="#8c6a38" stroke-width="0.8" filter="url(#tileShadow)"/>
  <text x="16" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#f5d77f" text-anchor="middle">7</text>

  <!-- 滑动中的高亮金色方块 8 -->
  <rect x="25" y="41" width="14" height="14" rx="3" fill="url(#brassTile)" stroke="#ffd700" stroke-width="1" filter="url(#tileShadow)"/>
  <text x="32" y="52" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#2d1c02" text-anchor="middle">8</text>

  <!-- 空格 (右下角槽位) -->
  <rect x="41" y="41" width="14" height="14" rx="3" fill="#0b0805" stroke="#1f160f" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
