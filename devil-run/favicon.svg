<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="1" stop-color="#a0208a"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cbf2"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4ff"/>
      <stop offset="1" stop-color="#7a83ba"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 环境粒子 -->
  <circle cx="12" cy="14" r="2.6" fill="#cfd6ff" opacity=".4"/>
  <circle cx="53" cy="22" r="2" fill="#cfd6ff" opacity=".3"/>
  <circle cx="17" cy="50" r="1.7" fill="#cfd6ff" opacity=".28"/>

  <!-- 塌陷地砖下方渗出的橙红机关光 -->
  <ellipse cx="32" cy="47" rx="22" ry="11" fill="url(#hot)"/>

  <!-- 两块地砖：其中一块已塌 -->
  <rect x="10" y="44" width="17" height="11" rx="3.2" fill="url(#tile)"/>
  <rect x="37" y="44" width="17" height="11" rx="3.2" fill="url(#tile)" opacity=".35"/>

  <!-- 猩红尖刺刚从塌陷处探出 -->
  <path d="M40 44l3.4-8.5 3.4 8.5z" fill="#ff5a3c"/>
  <path d="M47 44l3.4-6.5 3.4 6.5z" fill="#ff5a3c"/>

  <!-- 惊跳中的白色软胶小方块 -->
  <g>
    <rect x="19" y="14" width="16" height="23" rx="4.6" fill="#000" opacity=".28"/>
    <rect x="17.6" y="12" width="16" height="23" rx="4.6" fill="url(#cube)"/>
    <circle cx="22.4" cy="21" r="1.7" fill="#242a4d"/>
    <circle cx="28.6" cy="21" r="1.7" fill="#242a4d"/>
  </g>
</svg>
