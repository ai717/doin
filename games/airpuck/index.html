<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="极速气垫冰面刚体碰撞，同屏双人对决或大战 22 关电脑球王！" data-i18n="tagline">
  <title data-i18n="title">双人霓虹气垫球</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=dev">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <noscript>
    <div class="noscript-tip">
      <h2 data-i18n="title">双人霓虹气垫球</h2>
      <p>请启用 JavaScript 以进入赛博电玩球台对决。</p>
    </div>
  </noscript>

  <div id="game-app">
    <!-- 顶部电玩机台霓虹灯牌操作栏 -->
    <header id="game-header">
      <div class="header-left">
        <a href="/" id="back-home" class="tactile-btn back-btn" data-i18n="backHome">首页</a>
        <div class="header-title-box">
          <h1 id="game-title" data-i18n="title">双人霓虹气垫球</h1>
        </div>
      </div>

      <div class="header-controls">
        <button id="btn-mode" class="tactile-btn mode-btn" data-i18n="mode2p">双人同屏</button>
        <button id="btn-levels" class="tactile-btn" data-i18n="levels">关卡</button>
        <button id="btn-restart" class="tactile-btn icon-btn" title="瞬时重开" data-i18n="restart">↺ 重开</button>
        <button id="btn-pause" class="tactile-btn" data-i18n="pause">暂停</button>
        <button id="btn-sound" class="tactile-btn" data-i18n="soundOn">音效: 开</button>
        <button id="btn-lang" class="tactile-btn lang-btn" aria-label="Toggle Language">English</button>
      </div>
    </header>

    <!-- 赛博电玩主工作台视窗 -->
    <main id="game-workspace">
      <!-- 左侧红方 P1 驾驶席仪表 (Red Wing) -->
      <aside id="hud-left" class="workspace-wing red-wing">
        <div class="wing-card player-card">
          <div class="wing-label" data-i18n="p1Name">红方 P1 (WASD)</div>
          <div id="hud-p1-score" class="wing-value score-val red-score">0</div>
        </div>
        <div class="wing-card">
          <div class="wing-label" data-i18n="dashReady">扣杀就绪</div>
          <div id="hud-p1-dash" class="wing-value ready" data-i18n="dashReady">扣杀就绪</div>
          <div class="wing-sub" data-i18n="p1DashTip">空格: 突进重扣</div>
        </div>
        <div class="wing-card">
          <div class="wing-label" data-i18n="speedometer">球速</div>
          <div id="hud-p1-speed" class="wing-value speed-val">0 km/h</div>
        </div>
      </aside>

      <!-- 中央舞台 Canvas 视窗 -->
      <section id="canvas-container">
        <!-- 悬挂机台顶比分牌 -->
        <div id="match-banner">
          <span id="hud-act" class="banner-act">第一季 · 经典电玩街机厅</span>
          <span id="hud-level" class="banner-level">关卡 1 · 凯文</span>
        </div>
        <canvas id="game-canvas"></canvas>
      </section>

      <!-- 右侧蓝方 P2 / AI 驾驶席仪表 (Blue Wing) -->
      <aside id="hud-right" class="workspace-wing blue-wing">
        <div class="wing-card player-card">
          <div id="hud-p2-title" class="wing-label" data-i18n="aiName">赛博 AI</div>
          <div id="hud-p2-score" class="wing-value score-val blue-score">0</div>
        </div>
        <div class="wing-card">
          <div class="wing-label" data-i18n="dashReady">扣杀就绪</div>
          <div id="hud-p2-dash" class="wing-value ready" data-i18n="dashReady">扣杀就绪</div>
          <div class="wing-sub" data-i18n="p2DashTip">Shift: 突进重扣</div>
        </div>
        <div class="wing-card">
          <div class="wing-label" data-i18n="speedometer">球速</div>
          <div id="hud-p2-speed" class="wing-value speed-val">0 km/h</div>
        </div>
      </aside>
    </main>

    <!-- 暂停遮罩弹窗 -->
    <dialog id="dialog-pause" class="game-dialog">
      <div class="dialog-content">
        <h2 data-i18n="pause">暂停</h2>
        <p data-i18n="howToPlayDesc">【红方P1】WASD 移动，空格突进扣杀；【蓝方P2/AI】方向键移动，Shift/Enter 突进扣杀。在己方半场截击小球轰入对方球门，抢先斩获 5 分获胜！</p>
        <div class="dialog-actions">
          <button id="btn-resume" class="tactile-btn primary-btn" data-i18n="resume">继续对决</button>
        </div>
      </div>
    </dialog>

    <!-- 关卡选择弹窗 -->
    <dialog id="dialog-levels" class="game-dialog wide-dialog">
      <div class="dialog-content">
        <div class="dialog-header">
          <h2 data-i18n="levels">关卡</h2>
          <button id="btn-close-levels" class="close-x" aria-label="Close">✕</button>
        </div>
        <div id="levels-grid" class="levels-scroll-grid">
          <!-- JS 动态灌入 22 关卡片 -->
        </div>
      </div>
    </dialog>

    <!-- 终局结算胜利弹窗 -->
    <dialog id="dialog-won" class="game-dialog won-dialog">
      <div class="dialog-content won-card">
        <div class="won-badge">🏆</div>
        <h2 id="won-title" data-i18n="wonTitle">金杯夺冠 · 巅峰加冕</h2>
        <div id="won-stars" class="won-stars-row">★★★</div>

        <div class="won-stats-grid">
          <div class="stat-item">
            <span class="stat-lbl" data-i18n="matchScore">最终比分</span>
            <strong id="won-score" class="stat-num">5 - 2</strong>
          </div>
          <div class="stat-item">
            <span class="stat-lbl" data-i18n="matchTime">比赛用时</span>
            <strong id="won-time" class="stat-num">00:48</strong>
          </div>
          <div class="stat-item">
            <span class="stat-lbl" data-i18n="maxSpeedStat">最快球速</span>
            <strong id="won-speed" class="stat-num">108 km/h</strong>
          </div>
        </div>

        <div class="won-actions">
          <button id="btn-retry-match" class="tactile-btn" data-i18n="retryMatch">再战一局</button>
          <button id="btn-next-level" class="tactile-btn primary-btn" data-i18n="nextLevel">下一关</button>
          <button id="btn-close-won" class="tactile-btn icon-btn" data-i18n="closeBtn">关闭</button>
        </div>
      </div>
    </dialog>
  </div>

  <script type="module" src="js/main.mjs?v=dev"></script>
</body>
</html>
