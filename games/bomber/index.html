<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>炸弹人 · DOIN 在线小游戏</title>
  <meta name="description" content="在软胶街区沙盘里放定时炸弹，十字爆风炸砖拾道具，把会逃会算的气球怪堵进死胡同。5 章 40 关街区闯关 + 24 道限弹连锁爆破解谜，爆风预警、点格寻路、拆迁率与单连锁评级。">
  <link rel="icon" href="favicon.svg?v=dev" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <noscript>
    <div class="noscript-banner">
      <p data-i18n="noscript">需要启用 JavaScript 才能游玩。</p>
    </div>
  </noscript>

  <div id="game-app">
    <!-- 阁楼工坊顶栏：返回 / 音效 / 语言 / 玩法（静态骨架，热更新走 data-i18n） -->
    <header class="workshop-topbar">
      <a href="/" id="back-home" class="topbar-btn" data-i18n-attr="title" data-i18n="backHome" title="门户" aria-label="门户">←</a>
      <h1 class="topbar-title" data-i18n="gameTitle">炸弹人</h1>
      <div class="topbar-tools">
        <button id="btn-sound" class="topbar-btn" type="button" data-i18n-attr="title" data-i18n="btnSound" title="音效" aria-label="音效">🔊</button>
        <button id="btn-lang" class="topbar-btn" type="button">EN</button>
        <button id="btn-help" class="topbar-btn" type="button" data-i18n-attr="title" data-i18n="btnHelp" title="玩法" aria-label="玩法">?</button>
      </div>
    </header>

    <main class="workshop-body" id="game-root">
      <!-- 主体由 ui.mjs 动态填充 -->
    </main>
  </div>

  <script type="module" src="js/main.mjs?v=dev"></script>
</body>
</html>
