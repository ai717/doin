<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glaze" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2edfa"/>
      <stop offset="80%" stop-color="#1e5aa8"/>
      <stop offset="100%" stop-color="#0e346a"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#141923" stroke="#2a3b5c" stroke-width="2"/>
  
  <!-- Stacked tiles layer 1 -->
  <g filter="url(#shadow)">
    <rect x="18" y="24" width="28" height="26" rx="4" fill="#0b2447" stroke="#1d487f" stroke-width="1.5"/>
  </g>
  <!-- Stacked tiles layer 2 -->
  <g filter="url(#shadow)">
    <rect x="15" y="17" width="28" height="26" rx="4" fill="#143b6c" stroke="#2c69b0" stroke-width="1.5"/>
  </g>
  <!-- Top tile (active porcelain) -->
  <g filter="url(#shadow)">
    <rect x="21" y="11" width="28" height="26" rx="4" fill="url(#glaze)" stroke="#eef4fc" stroke-width="1.5"/>
    <!-- Cobalt flower motif -->
    <circle cx="35" cy="24" r="5" fill="#124080"/>
    <circle cx="35" cy="24" r="2.5" fill="#ffffff"/>
    <circle cx="35" cy="16" r="2" fill="#124080"/>
    <circle cx="35" cy="32" r="2" fill="#124080"/>
    <circle cx="27" cy="24" r="2" fill="#124080"/>
    <circle cx="43" cy="24" r="2" fill="#124080"/>
  </g>
</svg>
