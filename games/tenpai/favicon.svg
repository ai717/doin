<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="tile-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="tile-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f4ed"/>
      <stop offset="100%" stop-color="#e8e5d6"/>
    </linearGradient>
  </defs>

  <!-- Green felt table base -->
  <circle cx="32" cy="32" r="30" fill="#133d24" stroke="#256b41" stroke-width="2"/>

  <!-- Mahjong Tile with 3D green jade back -->
  <g filter="url(#tile-shadow)">
    <!-- Jade back -->
    <rect x="16" y="11" width="32" height="42" rx="6" fill="#1f7a46" stroke="#124a29" stroke-width="1.5"/>
    <!-- Ivory front layer -->
    <rect x="16" y="9" width="32" height="40" rx="5" fill="url(#tile-face)" stroke="#dcd8c4" stroke-width="1.2"/>
    <!-- Top gloss highlight -->
    <rect x="18" y="10" width="28" height="6" rx="3" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Character Red Middle '中' (Zhong) on tile -->
  <!-- Outer red square -->
  <rect x="23" y="22" width="18" height="15" rx="2" fill="none" stroke="#dc2626" stroke-width="3"/>
  <!-- Middle vertical stroke -->
  <line x1="32" y1="16" x2="32" y2="43" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/>
</svg>
