<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>疯狂扭螺丝 · DOIN 在线小游戏</title>
  <meta name="description" content="螺丝螺母色彩排序解压益智小游戏：常规 20 关 + 每日挑战 + 极限难题，把同色螺母归到同一根螺杆即可通关。手机触屏即点即玩。">
  <link rel="canonical" href="https://doin.win/nuts/">
  <meta name="theme-color" content="#0b0b1a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DOIN">
  <meta property="og:title" content="疯狂扭螺丝 · DOIN 在线小游戏">
  <meta property="og:description" content="螺丝螺母色彩排序：常规 20 关 + 每日挑战 + 极限难题，同色归组即通关。">
  <meta property="og:url" content="https://doin.win/nuts/">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="https://doin.win/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="疯狂扭螺丝 · DOIN 在线小游戏">
  <meta name="twitter:description" content="螺丝螺母色彩排序：常规 20 关 + 每日挑战 + 极限难题，同色归组即通关。">
  <meta name="twitter:image" content="https://doin.win/assets/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <main class="wrap">
    <header class="head">
      <h1 class="title">NUTS</h1>
      <p class="subtitle">疯狂扭螺丝 · 螺母色彩排序</p>
    </header>

    <nav class="tabs" id="tabs" aria-label="关卡包">
      <button class="tab is-on" data-pack="regular" type="button">常规</button>
      <button class="tab" data-pack="daily" type="button">每日</button>
      <button class="tab" data-pack="extreme" type="button">极限</button>
    </nav>

    <section class="stage" id="stage">
      <div class="stage-head">
        <div class="meta">
          <span class="label" id="level-label">LEVEL</span>
          <strong class="value" id="level-num">1</strong>
        </div>
        <div class="meta">
          <span class="label">MOVES</span>
          <strong class="value" id="moves">0</strong>
        </div>
        <div class="meta">
          <span class="label">TIME</span>
          <strong class="value" id="time">00:00</strong>
        </div>
        <div class="meta">
          <span class="label">PAR</span>
          <strong class="value" id="par">--</strong>
        </div>
      </div>
      <p class="hint" id="hint">点击螺杆取下顶端螺母，再点任意有空位的螺杆放入；每根螺杆只放同色即通关。</p>

      <div class="board" id="board" aria-label="游戏棋盘"></div>

      <div class="controls">
        <button class="btn" id="undo" type="button" disabled>UNDO</button>
        <button class="btn" id="restart" type="button">RESTART</button>
        <button class="btn" id="levels" type="button">LEVELS</button>
      </div>
    </section>

    <div class="overlay" id="win-overlay" hidden>
      <div class="overlay-box">
        <p class="overlay-title" id="win-title">CLEAR!</p>
        <p class="overlay-stars" id="win-stars" aria-hidden="true">★</p>
        <p class="overlay-stat">步数 <strong id="win-moves">0</strong> · 用时 <strong id="win-time">--</strong></p>
        <p class="overlay-badges" id="win-badges"></p>
        <div class="overlay-actions">
          <button class="btn" id="next-level" type="button">NEXT</button>
          <button class="btn btn-alt" id="replay-level" type="button">REPLAY</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="levels-overlay" hidden>
      <div class="overlay-box wide">
        <p class="overlay-title">SELECT LEVEL</p>
        <div class="level-grid" id="level-grid"></div>
        <button class="btn btn-alt" id="close-levels" type="button">CLOSE</button>
      </div>
    </div>

    <nav class="back"><a href="/">← 返回 DOIN 游戏列表</a></nav>
  </main>
  <noscript><p class="noscript">需要启用 JavaScript 才能游玩疯狂扭螺丝。</p></noscript>
  <script type="module" src="game.js"></script>
</body>
</html>
