<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pinBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="gearGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#pinBg)"/>
  <!-- Central Gear -->
  <circle cx="32" cy="28" r="14" fill="url(#gearGold)" filter="url(#gearShadow)"/>
  <circle cx="32" cy="28" r="8" fill="#141c2c"/>
  <circle cx="32" cy="28" r="3" fill="#e74c3c"/>
  <!-- Radiating Pins -->
  <line x1="32" y1="14" x2="32" y2="4" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="32" cy="4" r="2.5" fill="#e74c3c"/>
  <line x1="18" y1="28" x2="8" y2="28" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="8" cy="28" r="2.5" fill="#e74c3c"/>
  <line x1="46" y1="28" x2="56" y2="28" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="56" cy="28" r="2.5" fill="#e74c3c"/>
  <line x1="22" y1="18" x2="15" y2="11" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="15" cy="11" r="2.5" fill="#e74c3c"/>
  <line x1="42" y1="18" x2="49" y2="11" stroke="#4a90e2" stroke-width="2"/>
  <circle cx="49" cy="11" r="2.5" fill="#e74c3c"/>
  <!-- Incoming Hero Pin from Bottom -->
  <line x1="32" y1="58" x2="32" y2="44" stroke="#4a90e2" stroke-width="2.5"/>
  <polygon points="32,41 29.5,45 34.5,45" fill="#ffd54f"/>
  <circle cx="32" cy="58" r="3" fill="#ffd54f"/>
  <!-- Sparkle at contact -->
  <path d="M32 39 L33 41 L35 42 L33 43 L32 45 L31 43 L29 42 L31 41 Z" fill="#fff7b0"/>
</svg>
