<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72b5a5"/>
      <stop offset="100%" stop-color="#3d7265"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="50%" stop-color="#ffa502"/>
      <stop offset="100%" stop-color="#fffa65"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Seal base with rounded square -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#sealGrad)" stroke="#8ee3d0" stroke-width="2"/>
  <rect x="10" y="10" width="44" height="44" rx="10" fill="#2d5248" opacity="0.6"/>
  <!-- Glowing flame / glyph totem -->
  <g filter="url(#glow)">
    <!-- Central flame -->
    <path d="M32 14 C35 22 40 28 36 42 C34 46 30 46 28 42 C24 28 29 22 32 14 Z" fill="url(#fireGrad)"/>
    <!-- Left horn -->
    <path d="M28 34 C22 30 16 26 18 20 C22 28 26 31 30 36 Z" fill="url(#fireGrad)"/>
    <!-- Right horn -->
    <path d="M36 34 C42 30 48 26 46 20 C42 28 38 31 34 36 Z" fill="url(#fireGrad)"/>
    <!-- Core hot droplet -->
    <circle cx="32" cy="38" r="3" fill="#ffffff"/>
  </g>
</svg>
