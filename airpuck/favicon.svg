<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="puckGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redStriker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5277"/>
      <stop offset="60%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b70026"/>
    </linearGradient>
    <linearGradient id="blueStriker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="60%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#0069c0"/>
    </linearGradient>
  </defs>
  <!-- Background Court Disc -->
  <rect width="64" height="64" rx="16" fill="#0b0f19"/>
  <circle cx="32" cy="32" r="28" stroke="#1c2738" stroke-width="2" fill="none"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="#1c2738" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Left Red Striker -->
  <circle cx="18" cy="32" r="12" fill="url(#redStriker)"/>
  <circle cx="18" cy="32" r="5" fill="#ff859d"/>
  
  <!-- Right Blue Striker -->
  <circle cx="46" cy="32" r="12" fill="url(#blueStriker)"/>
  <circle cx="46" cy="32" r="5" fill="#80d8ff"/>

  <!-- Centered Glowing Puck -->
  <circle cx="32" cy="32" r="8" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="32" cy="32" r="14" fill="url(#puckGlow)" pointer-events="none"/>
</svg>
