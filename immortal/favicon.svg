<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cauldronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8a17e"/>
      <stop offset="100%" stop-color="#5a4933"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="50%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="swordGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fab1a0"/>
      <stop offset="50%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cauldron Tripod Legs -->
  <path d="M18 44 L14 56 L22 56 Z" fill="#4a3b2a"/>
  <path d="M46 44 L50 56 L42 56 Z" fill="#4a3b2a"/>
  <path d="M30 46 L34 58 L28 58 Z" fill="#3a2e20"/>

  <!-- Cauldron Body -->
  <rect x="14" y="32" width="36" height="20" rx="9" fill="url(#cauldronGrad)" stroke="#74b9ff" stroke-width="1.2"/>
  <!-- Cauldron Handles -->
  <path d="M14 36 C10 36 10 44 14 44" fill="none" stroke="#b8a17e" stroke-width="3"/>
  <path d="M50 36 C54 36 54 44 50 44" fill="none" stroke="#b8a17e" stroke-width="3"/>

  <!-- Rising Sacred Fire -->
  <ellipse cx="32" cy="30" rx="14" ry="7" fill="url(#fireGrad)" filter="url(#goldGlow)"/>

  <!-- Golden Flying Sword -->
  <g filter="url(#goldGlow)">
    <!-- Blade -->
    <polygon points="32,6 35,24 33,32 31,32 29,24" fill="url(#swordGrad)"/>
    <!-- Guard -->
    <rect x="27" y="30" width="10" height="3" rx="1.5" fill="#f39c12"/>
    <!-- Hilt -->
    <rect x="31" y="33" width="2" height="5" fill="#e17055"/>
    <circle cx="32" cy="39" r="2" fill="#f39c12"/>
  </g>
</svg>
