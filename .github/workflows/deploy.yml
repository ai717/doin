name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test orbit-sort
        run: npm run test:orbit-sort

      - name: Build static site
        run: npm run build
        env:
          ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          ENABLE_ADS: ${{ vars.ENABLE_ADS }}
          ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          cname: ${{ vars.PAGES_CNAME }}
