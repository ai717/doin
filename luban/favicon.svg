<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="wood-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark workshop circular background -->
  <circle cx="32" cy="32" r="30" fill="#20150e" stroke="#543725" stroke-width="2"/>

  <!-- Interlocking Luban Cross in Isometric projection -->
  <g filter="url(#wood-shadow)">
    <!-- Back horizontal bar (Walnut) -->
    <polygon points="12,28 32,16 52,28 32,40" fill="#c0783e"/>
    <!-- Vertical post (Cedar) -->
    <polygon points="26,14 38,14 38,50 26,50" fill="#a05e2c"/>
    <polygon points="38,14 44,18 44,54 38,50" fill="#7a421b"/>
    <!-- Interlocking Front Cross bar (Golden Key) -->
    <polygon points="20,34 32,27 44,34 32,41" fill="#e8a84c"/>
    <polygon points="20,34 20,40 32,47 32,41" fill="#b87728"/>
    <polygon points="44,34 44,40 32,47 32,41" fill="#915818"/>
  </g>

  <!-- Small mortise notch marker -->
  <rect x="29" y="30" width="6" height="5" fill="#522a0a" opacity="0.6"/>
</svg>
